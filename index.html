<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP Number Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f5f7fb;font-family:system-ui,Arial,sans-serif}.header{position:sticky;top:0;z-index:5;background:#070b14ee;border-bottom:1px solid #263149}.nav{max-width:1180px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#ffd76a;color:#111;font-size:21px;cursor:pointer}.hero,.toolbar,.grid{max-width:1180px;margin:auto;padding-left:18px;padding-right:18px}.hero{padding-top:52px;padding-bottom:25px}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1;margin:0 0 14px}.hero span{color:#ffd76a}.hero p{color:#aab3c7;line-height:1.6;max-width:700px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:22px}.toolbar input,.toolbar select,.modal input{background:#0e1524;color:white;border:1px solid #2b3852;border-radius:12px;padding:12px}.toolbar input{flex:1;min-width:210px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding-bottom:50px}.card{background:linear-gradient(180deg,#121a29,#0b101b);border:1px solid #2a3650;border-radius:20px;padding:18px}.num{font-size:26px;font-weight:900;letter-spacing:1px}.price{color:#ffd76a;font-weight:800;font-size:18px;margin-top:8px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#aab3c7;font-size:13px}.total{background:#1b2639;border:1px solid #394761;border-radius:999px;padding:7px 10px;color:white;font-weight:800}.actions{display:flex;gap:8px;margin-top:15px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.wa{background:#25d366;color:#06140a;flex:1}.copy{background:#182337;color:#fff}.empty{text-align:center;grid-column:1/-1;color:#9aa6ba;padding:60px 10px}.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center;padding:18px}.modal{width:min(470px,100%);background:#0e1524;border:1px solid #2d3a55;border-radius:20px;padding:22px}.modal input{width:100%;margin:7px 0}.primary{background:#ffd76a;color:#111;width:100%;margin-top:8px}.close{float:right;background:none;border:0;color:#9aa6ba;font-size:22px}.adminlist{margin-top:16px;display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;background:#131e30;border:1px solid #2a3852;border-radius:12px;padding:10px;gap:10px}.danger{background:#ff596b;color:white}@media(max-width:600px){.hero{padding-top:38px}.num{font-size:23px}}
</style></head><body>
<header class="header"><div class="nav"><div class="brand"><div class="mark" id="secret">✦</div>VIP Number Hub</div><small>Premium • Fancy • Numerology</small></div></header>
<section class="hero"><h1>Find Your <span>Perfect VIP Number</span></h1><p>Premium mobile numbers with price, pattern and automatic numerology total.</p></section>
<div class="toolbar"><input id="search" placeholder="Search number, pattern or category"><select id="cat"><option value="">All categories</option><option>VIP</option><option>Fancy</option><option>Premium</option><option>Numerology</option></select><select id="sort"><option value="new">Newest</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></div>
<main id="grid" class="grid"></main>

<div id="login" class="overlay"><div class="modal"><button class="close" onclick="hide('login')">×</button><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Login</button></div></div>
<div id="admin" class="overlay"><div class="modal"><button class="close" onclick="hide('admin')">×</button><h2>Admin Dashboard</h2><p style="color:#aab3c7">Numbers added here are stored in the shared Supabase database.</p>
<input id="num" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number"><div id="total" class="total">Total = —</div><input id="price" type="number" placeholder="Price ₹"><input id="category" placeholder="Category e.g. VIP"><input id="pattern" placeholder="Pattern / note"><input id="wa" placeholder="WhatsApp number"><button class="btn primary" onclick="addNumber()">Add Number</button><button class="btn" style="width:100%;margin-top:8px;background:#182337;color:#fff" onclick="logout()">Logout</button><div id="adminlist" class="adminlist"></div>
</div></div><div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:white;color:#111;padding:11px 15px;border-radius:12px;font-weight:800;z-index:50"></div>

<script>
const CONFIG={SUPABASE_URL:"https://supabase.com/dashboard/project/tkethohdttyovopxjliq/settings/api-keys",SUPABASE_KEY:"sb_publishable_DHXz-jQEw8DzMOeVc_YruA_pw16iy4m"};
let db=null,items=[],taps=0,timer=null;
function root(n){let s=[...String(n||"").replace(/\D/g,"")].reduce((a,d)=>a+Number(d),0);while(s>9)s=[...String(s)].reduce((a,d)=>a+Number(d),0);return s||null}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN")}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function hide(id){document.getElementById(id).style.display="none"}
function render(){let q=document.getElementById("search").value.toLowerCase(),c=document.getElementById("cat").value,s=document.getElementById("sort").value;a=items.filter(x=>(!q||[x.number,x.pattern,x.category].join(" ").toLowerCase().includes(q))&&(!c||x.category===c));a.sort((x,y)=>s==="low"?x.price-y.price:s==="high"?y.price-x.price:new Date(y.created_at)-new Date(x.created_at));document.getElementById("grid").innerHTML=a.length?a.map(x=>`<article class="card"><div class="num">${esc(x.number)}</div><div class="price">${money(x.price)}</div><div class="meta"><span>${esc(x.category||"VIP")}</span><span class="total">Total = ${root(x.number)}</span></div>${x.pattern?`<div style="color:#9da9bd;margin-top:10px">${esc(x.pattern)}</div>`:""}<div class="actions">${x.whatsapp?`<button class="btn wa" onclick="wa('${encodeURIComponent(x.whatsapp)}','${encodeURIComponent(x.number)}')">WhatsApp</button>`:""}<button class="btn copy" onclick="copyNum('${esc(x.number)}')">Copy</button></div></article>`).join(""):'<div class="empty">No VIP numbers available yet.<br>Add your first number from the hidden admin dashboard.</div>'}
async function load(){if(!db)return;let {data,error}=await db.from("vip_numbers").select("*").order("created_at",{ascending:false});if(error){document.getElementById("grid").innerHTML='<div class="empty">Supabase configuration/table is not ready.</div>';return}items=data||[];render();renderAdmin()}
async function login(){let {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value});if(error)return toast(error.message);hide("login");document.getElementById("admin").style.display="flex";renderAdmin();toast("Login successful")}
async function logout(){await db.auth.signOut();hide("admin");toast("Logged out")}
async function addNumber(){let {data:u}=await db.auth.getUser();if(!u.user)return toast("Login again");let n=document.getElementById("num").value.replace(/\D/g,"");if(n.length!==10)return toast("Enter 10 digits");let p=document.getElementById("price").value;if(!p)return toast("Enter price");let row={number:n,price:Number(p),category:document.getElementById("category").value.trim()||"VIP",pattern:document.getElementById("pattern").value.trim(),whatsapp:document.getElementById("wa").value.replace(/\D/g,"")};let {error}=await db.from("vip_numbers").insert(row);if(error)return toast(error.message);["num","price","category","pattern","wa"].forEach(id=>document.getElementById(id).value="");document.getElementById("total").textContent="Total = —";await load();toast("Number added")}
async function del(id){if(!confirm("Delete this number?"))return;let {error}=await db.from("vip_numbers").delete().eq("id",id);if(error)return toast(error.message);await load();toast("Deleted")}
function renderAdmin(){document.getElementById("adminlist").innerHTML=items.map(x=>`<div class="row"><span><b>${esc(x.number)}</b><br><small>${money(x.price)} • Total ${root(x.number)}</small></span><button class="btn danger" onclick="del(${x.id})">Delete</button></div>`).join("")}
function wa(w,n){open("https://wa.me/"+decodeURIComponent(w)+"?text="+encodeURIComponent("Hello, I am interested in VIP number "+decodeURIComponent(n)),"_blank")}
async function copyNum(n){try{await navigator.clipboard.writeText(n);toast("Number copied")}catch(e){toast("Copy failed")}}
document.getElementById("num").oninput=e=>document.getElementById("total").textContent="Total = "+(root(e.target.value)||"—");
["search","cat","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("secret").onclick=()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,1100);if(taps>=5){taps=0;document.getElementById("login").style.display="flex"}};
(async()=>{if(CONFIG.SUPABASE_URL.startsWith("PASTE_")){document.getElementById("grid").innerHTML='<div class="empty">Demo preview ready.<br>Add your Supabase URL and Publishable Key in CONFIG to connect the live database.</div>';return}db=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);await load()})();
</script></body></html>
